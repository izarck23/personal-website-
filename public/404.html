<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>codertech — Software Developer & Tech Creator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths to index.html with appropriate hash/query to prevent blank screens
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        
        // Detect if hosted under a repository subfolder e.g. username.github.io/repo/
        var isGitHubPages = l.hostname.indexOf('github.io') > -1;
        if (isGitHubPages && l.pathname.split('/').length > 2) {
          pathSegmentsToKeep = 1;
        }

        var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var search = l.search ? l.search : '';
        var hash = l.hash ? l.hash : '';

        // If path exists, route it correctly
        if (path) {
          if (path === 'auth' || path === 'auth.html' || path.startsWith('auth/')) {
            var authSub = path.replace('auth.html', '').replace('auth/', '').replace('auth', '');
            var authTarget = 'auth.html' + (authSub ? '#' + authSub : (hash ? hash : '')) + (search ? search : '');
            var directAuthUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/' + authTarget;
            window.location.replace(directAuthUrl);
            return;
          }
          if (path === 'profile' || path === 'profile.html') {
            var directProfileUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/profile.html' + (hash ? hash : '') + (search ? search : '');
            window.location.replace(directProfileUrl);
            return;
          }
          if (path.indexOf('blog') === 0 || path.indexOf('projects') === 0 || path.indexOf('store') === 0) {
            hash = '#/' + path;
          }
        }

        var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/' +
          (hash ? hash : '') + (search && !hash.includes('?') ? search : '');

        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; background-color: #FFF8F3; color: #2d3748; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px;">
    <div>
      <h2 style="color: #6C5CE7; margin-bottom: 8px;">Redirecting to codertech...</h2>
      <p style="color: #718096; font-size: 14px;">Please wait while we bring you to the right page.</p>
    </div>
  </body>
</html>
